<!-- index.html -->
<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
    <title>MC YouTube模拟器 6.0</title>
    <link rel="stylesheet" href="style.css" />
</head>
<body>
    <div id="toast" class="toast"></div>
    <div id="achievementToast" class="achievement-unlock-toast"></div>

    <!-- 纯净定制小手机系统外壳 -->
    <div class="phone-wrapper" id="phoneWrapper">
        <!-- 灵动岛 -->
        <div class="phone-notch">
            <div class="phone-camera-lens"></div>
        </div>

        <!-- 智能感知色彩状态栏 -->
        <div class="status-bar" id="statusBar">
            <div id="statusTimeText">12:00</div>
            <div class="status-bar-right">
                <!-- 信号 -->
                <svg class="status-bar-svg" viewBox="0 0 24 24">
                    <rect x="2" y="16" width="3.5" height="5" rx="1"></rect>
                    <rect x="7.5" y="12" width="3.5" height="9" rx="1"></rect>
                    <rect x="13" y="7" width="3.5" height="14" rx="1"></rect>
                    <rect x="18.5" y="2" width="3.5" height="19" rx="1"></rect>
                </svg>

                <!-- Wi-Fi -->
                <svg class="status-bar-svg" viewBox="0 0 24 24" id="wifiSvg">
                    <path d="M12 18a1.5 1.5 0 100 3 1.5 1.5 0 000-3z"></path>
                    <path d="M4.93 12.93a10 10 0 0114.14 0l-1.41 1.41a8 8 0 00-11.32 0l-1.41-1.41z"></path>
                    <path d="M2.1 10.1a14 14 0 0119.8 0l-1.41 1.41a12 12 0 00-16.98 0L2.1 10.1z"></path>
                </svg>

                <!-- 电池与四芒星充电指示 -->
                <div class="battery-pill">
                    <div class="charging-star-icon" id="chargingStarIcon">
                        <svg viewBox="0 0 100 100">
                            <path d="M50 0 Q50 50 0 50 Q50 50 50 100 Q50 50 100 50 Q50 50 50 0 Z"/>
                        </svg>
                    </div>
                    <div class="battery-shell">
                        <div class="battery-core" id="batteryCoreBar"></div>
                    </div>
                    <div class="battery-text" id="batteryPercentText">100%</div>
                </div>
            </div>
        </div>

        <!-- 1. 锁屏界面 -->
        <div class="screen-lock" id="screenLock">
            <div class="lock-time-box">
                <div class="lock-date" id="lockDateText">10月24日 星期四</div>
                <div class="lock-clock" id="lockClockText">12:00</div>
            </div>

            <div class="lock-swipe-panel" id="unlockTapArea">
                <svg class="lock-arrow-svg" viewBox="0 0 24 24">
                    <polyline points="18 15 12 9 6 15"></polyline>
                </svg>
                <div class="lock-swipe-tip">向上滑动或轻触解锁</div>
            </div>
        </div>

        <!-- 2. 桌面主界面 -->
        <div class="screen-desktop" id="screenDesktop">
            <div class="desktop-top-widget">
                <div class="widget-day-info" id="desktopWidgetInfo">第 <span>1</span> 天 · 早晨 (行动点 6/6)</div>
                <button class="widget-lock-action" id="lockBtn">锁定屏幕</button>
            </div>

            <!-- 应用网格（各独立 App 入口槽位） -->
            <div class="app-grid">
                <div class="app-slot" id="appSlotChat" onclick="openPhoneApp('chat')">
                    <div class="app-icon-box" style="background: linear-gradient(135deg, #51cf66, #2b8a3e);">
                        <svg class="app-icon-svg" viewBox="0 0 24 24" fill="#ffffff">
                            <path d="M20 2H4c-1.1 0-2 .9-2 2v18l4-4h14c1.1 0 2-.9 2-2V4c0-1.1-.9-2-2-2z"/>
                        </svg>
                        <div class="app-unread-badge" id="chatUnreadBadge" style="display:none;">0</div>
                    </div>
                    <div class="app-title-label">聊天中心</div>
                </div>

                <div class="app-slot" id="appSlotMoments" onclick="openPhoneApp('moments')">
                    <div class="app-icon-box" style="background: linear-gradient(135deg, #ff8787, #e03131);">
                        <svg class="app-icon-svg" viewBox="0 0 24 24" fill="#ffffff">
                            <path d="M12 21.35l-1.45-1.32C5.4 15.36 2 12.28 2 8.5 2 5.42 4.42 3 7.5 3c1.74 0 3.41.81 4.5 2.09C13.09 3.81 14.76 3 16.5 3 19.58 3 22 5.42 22 8.5c0 3.78-3.4 6.86-8.55 11.54L12 21.35z"/>
                        </svg>
                    </div>
                    <div class="app-title-label">朋友圈</div>
                </div>

                <div class="app-slot" id="appSlotYoutube" onclick="openPhoneApp('youtube')">
                    <div class="app-icon-box" style="background: linear-gradient(135deg, #ff6b6b, #c92a2a);">
                        <svg class="app-icon-svg" viewBox="0 0 24 24" fill="#ffffff">
                            <path d="M21.58 7.19c-.23-.86-.91-1.54-1.77-1.77C18.25 5 12 5 12 5s-6.25 0-7.81.42c-.86.23-1.54.91-1.77 1.77C2 8.75 2 12 2 12s0 3.25.42 4.81c.23.86.91 1.54 1.77 1.77C5.75 19 12 19 12 19s6.25 0 7.81-.42c.86-.23 1.54-.91 1.77-1.77C22 15.25 22 12 22 12s0-3.25-.42-4.81zM10 15V9l5.2 3-5.2 3z"/>
                        </svg>
                    </div>
                    <div class="app-title-label">油管视频</div>
                </div>

                <div class="app-slot" id="appSlotAo3" onclick="openPhoneApp('ao3')">
                    <div class="app-icon-box" style="background: linear-gradient(135deg, #cc5de8, #862e9c);">
                        <svg class="app-icon-svg" viewBox="0 0 24 24" fill="#ffffff">
                            <path d="M18 2H6c-1.1 0-2 .9-2 2v16c0 1.1.9 2 2 2h12c1.1 0 2-.9 2-2V4c0-1.1-.9-2-2-2zM6 4h5v8l-2.5-1.5L6 12V4z"/>
                        </svg>
                    </div>
                    <div class="app-title-label">AO3同人</div>
                </div>

                <div class="app-slot" id="appSlotStream" onclick="openPhoneApp('streaming')">
                    <div class="app-icon-box" style="background: linear-gradient(135deg, #748ffc, #364fc7);">
                        <svg class="app-icon-svg" viewBox="0 0 24 24" fill="#ffffff">
                            <path d="M17 10.5V7c0-.55-.45-1-1-1H4c-.55 0-1 .45-1 1v10c0 .55.45 1 1 1h12c.55 0 1-.45 1-1v-3.5l4 4v-11l-4 4z"/>
                        </svg>
                    </div>
                    <div class="app-title-label">开播中心</div>
                </div>

                <div class="app-slot" id="appSlotStory" onclick="openPhoneApp('story')">
                    <div class="app-icon-box" style="background: linear-gradient(135deg, #20c997, #099268);">
                        <svg class="app-icon-svg" viewBox="0 0 24 24" fill="#ffffff">
                            <path d="M4 6h16v2H4zm0 5h16v2H4zm0 5h16v2H4z"/>
                        </svg>
                    </div>
                    <div class="app-title-label">主线频道</div>
                </div>

                <!-- 个性主题 APP -->
                <div class="app-slot" id="appSlotTheme" onclick="openPhoneApp('theme')">
                    <div class="app-icon-box">
                        <img src="assets/icons/theme.png" alt="个性主题" />
                    </div>
                    <div class="app-title-label">个性主题</div>
                </div>

                <div class="app-slot" id="appSlotShop" onclick="openPhoneApp('shop')">
                    <div class="app-icon-box" style="background: linear-gradient(135deg, #38d9a9, #087f5b);">
                        <svg class="app-icon-svg" viewBox="0 0 24 24" fill="#ffffff">
                            <path d="M20 6h-4V4c0-1.11-.89-2-2-2h-4c-1.11 0-2 .89-2 2v2H4c-1.11 0-1.99.89-1.99 2L2 19c0 1.11.89 2 2 2h16c1.11 0 2-.89 2-2V8c0-1.11-.89-2-2-2zm-6 0h-4V4h4v2z"/>
                        </svg>
                    </div>
                    <div class="app-title-label">商务赞助</div>
                </div>
            </div>

            <!-- 底部 Dock 栏 -->
            <div>
                <div class="dock-container">
                    <div class="app-slot" onclick="openPhoneApp('contacts')">
                        <div class="app-icon-box" style="background: #2b8a3e; width: 50px; height: 50px;">
                            <svg class="app-icon-svg" style="width:25px;height:25px;" viewBox="0 0 24 24" fill="#ffffff">
                                <path d="M20.01 15.38c-1.23 0-2.42-.2-3.53-.56a.977.977 0 00-1.01.24l-1.57 1.97c-2.83-1.44-5.15-3.75-6.59-6.59l1.97-1.57c.28-.28.36-.67.25-1.02A11.36 11.36 0 018.57 4c0-.55-.45-1-1-1H4c-.55 0-1 .45-1 1 0 9.39 7.61 17 17 17 .55 0 1-.45 1-1v-3.5c0-.55-.45-1-1-1.12z"/>
                            </svg>
                        </div>
                    </div>
                    <div class="app-slot" onclick="openPhoneApp('settings')">
                        <div class="app-icon-box" style="width: 50px; height: 50px;">
                            <img src="assets/icons/icon_settings.png" alt="系统设置" />
                        </div>
                    </div>
                    <div class="app-slot" onclick="openPhoneApp('backup')">
                        <div class="app-icon-box" style="background: #845ef7; width: 50px; height: 50px;">
                            <svg class="app-icon-svg" style="width:25px;height:25px;" viewBox="0 0 24 24" fill="#ffffff">
                                <path d="M19 3H5c-1.1 0-2 .9-2 2v14c0 1.1.9 2 2 2h14c1.1 0 2-.9 2-2V5c0-1.1-.9-2-2-2zm-2 10h-4v4h-2v-4H7v-2h4V7h2v4h4v2z"/>
                            </svg>
                        </div>
                    </div>
                </div>
                <div class="home-bar-pill"></div>
            </div>
        </div>

        <!-- 3. App 独立全屏窗口容器 -->
        <div class="app-modal-layer" id="appModal">
            <div class="app-modal-head">
                <button class="app-back-nav" onclick="closePhoneApp()">
                    <svg style="width:18px;height:18px;fill:currentColor;" viewBox="0 0 24 24">
                        <path d="M15.41 7.41L14 6l-6 6 6 6 1.41-1.41L10.83 12z"/>
                    </svg>
                    桌面
                </button>
                <div class="app-head-title" id="appModalTitle">应用窗口</div>
                <div style="width: 44px;"></div>
            </div>
            <div class="app-modal-body" id="appModalBody"></div>
            <div class="app-modal-foot">
                <div class="app-foot-home" onclick="closePhoneApp()"></div>
            </div>
        </div>

        <!-- 游戏核心功能底层宿主 -->
        <div id="app" class="game-inner-viewport">
            <div id="setupPage" class="page active"></div>
            <div id="gamePage" style="display:none;"></div>
        </div>

        <!-- 全站复古 Windows 风格弹窗基座 -->
        <div class="modal-overlay" id="modal">
            <div class="modal-box retro-pink-window" id="modalContent">
                <div class="retro-pink-titlebar">
                    <span id="retroModalTitle">系统提示</span>
                    <button class="retro-pink-btn close-btn" id="modalClose">✕</button>
                </div>
                <div class="retro-pink-content" id="modalBody"></div>
            </div>
        </div>
    </div>
    
    <!-- 安全 DOM 代理 -->
    <script>
        (function(){
            window.$ = function(id) {
                return document.getElementById(id);
            };
            window.addEventListener('error', function(e) {
                console.warn('[WebView Warning]:', e.message);
            });
        })();
    </script>

    <!-- 1. 底层核心与游戏数据 -->
    <script src="js/01-state-config.js"></script>
    <script src="js/02-ai-network.js"></script>
    <script src="js/03-game-core-1.js"></script>
    <script src="js/04-game-core-2.js"></script>
    <script src="js/05-streaming.js"></script>
    <script src="js/06-video-story.js"></script>
    <script src="js/07-actions-social.js"></script>
    <script src="js/10-native-bridge.js"></script>
    <script src="js/11-image-backup.js"></script>
    <script src="js/08-save-load.js"></script>
    <script src="js/09-events-init.js"></script>

    <!-- 2. 硬件外壳系统与原生功能驱动 -->
    <script src="js/shell/phone-shell.js"></script>

    <!-- 3. 悬浮球诊断中枢与玩家功能向导系统 -->
    <script src="js/system/assistant-registry.js"></script>
    <script src="js/system/assistant-agent.js"></script>
    <script src="js/system/error-monitor.js"></script>

    <!-- 4. 独立 App 模块矩阵 -->
    <script src="js/apps/theme/theme-app.js"></script>
    <script src="js/apps/settings/settings-app.js"></script>

    <!-- 视图启动器 -->
    <script>
        document.addEventListener('DOMContentLoaded', function() {
            setTimeout(function() {
                try {
                    if (typeof OtomeSecurityGuard !== 'undefined' && OtomeSecurityGuard.isDeviceBanned()) {
                        if (typeof showDeviceBanLockScreen === 'function') {
                            showDeviceBanLockScreen();
                            return;
                        }
                    }

                    var autoInfo = (typeof getAutoSaveInfo === 'function') ? getAutoSaveInfo() : null;
                    var hasValidSave = !!(autoInfo && autoInfo.data && (autoInfo.data.player || autoInfo.data.npcs));

                    if (hasValidSave && typeof resumeAutoSave === 'function') {
                        resumeAutoSave();
                    } else {
                        var setup = document.getElementById('setupPage');
                        var game = document.getElementById('gamePage');
                        if (setup) { setup.classList.add('active'); setup.style.display = 'block'; }
                        if (game) { game.classList.remove('active'); game.style.display = 'none'; }
                    }
                } catch(e) {
                    console.warn('视图启动器遇到异常:', e);
                }
            }, 120);
        });
    </script>
</body>
</html>
