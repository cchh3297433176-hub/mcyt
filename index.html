<!-- index.html -->
<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
    <title>🎀 MC YouTube模拟器💕 6.0</title>
    <link rel="stylesheet" href="style.css" />
</head>
<body>
    <div id="toast" class="toast"></div>
    <div id="achievementToast" class="achievement-unlock-toast"></div>

    <!-- 📱 纯净定制小手机系统外壳 -->
    <div class="phone-wrapper" id="phoneWrapper">
        <!-- 灵动岛 -->
        <div class="phone-notch">
            <div class="phone-camera-lens"></div>
        </div>

        <!-- 智能感知色彩状态栏 -->
        <div class="status-bar" id="statusBar">
            <div id="statusTimeText">12:00</div>
            <div class="status-bar-right">
                <!-- 信号 -->
                <svg class="status-bar-svg" viewBox="0 0 24 24">
                    <rect x="2" y="16" width="3.5" height="5" rx="1"></rect>
                    <rect x="7.5" y="12" width="3.5" height="9" rx="1"></rect>
                    <rect x="13" y="7" width="3.5" height="14" rx="1"></rect>
                    <rect x="18.5" y="2" width="3.5" height="19" rx="1"></rect>
                </svg>

                <!-- Wi-Fi -->
                <svg class="status-bar-svg" viewBox="0 0 24 24" id="wifiSvg">
                    <path d="M12 18a1.5 1.5 0 100 3 1.5 1.5 0 000-3z"></path>
                    <path d="M4.93 12.93a10 10 0 0114.14 0l-1.41 1.41a8 8 0 00-11.32 0l-1.41-1.41z"></path>
                    <path d="M2.1 10.1a14 14 0 0119.8 0l-1.41 1.41a12 12 0 00-16.98 0L2.1 10.1z"></path>
                </svg>

                <!-- 电池与四芒星充电指示 -->
                <div class="battery-pill">
                    <div class="charging-star-icon" id="chargingStarIcon">
                        <svg viewBox="0 0 100 100">
                            <path d="M50 0 Q50 50 0 50 Q50 50 50 100 Q50 50 100 50 Q50 50 50 0 Z"/>
                        </svg>
                    </div>
                    <div class="battery-shell">
                        <div class="battery-core" id="batteryCoreBar"></div>
                    </div>
                    <div class="battery-text" id="batteryPercentText">100%</div>
                </div>
            </div>
        </div>

        <!-- 1. 锁屏界面 -->
        <div class="screen-lock" id="screenLock">
            <div class="lock-time-box">
                <div class="lock-date" id="lockDateText">10月24日 星期四</div>
                <div class="lock-clock" id="lockClockText">12:00</div>
            </div>

            <div class="lock-swipe-panel" id="unlockTapArea">
                <svg class="lock-arrow-svg" viewBox="0 0 24 24">
                    <polyline points="18 15 12 9 6 15"></polyline>
                </svg>
                <div class="lock-swipe-tip">向上滑动或轻触解锁</div>
            </div>
        </div>

        <!-- 2. 桌面主界面 -->
        <div class="screen-desktop" id="screenDesktop">
            <div class="desktop-top-widget">
                <div class="widget-day-info" id="desktopWidgetInfo">第 <span>1</span> 天 · 早晨 (行动点 6/6)</div>
                <button class="widget-lock-action" id="lockBtn">锁定屏幕</button>
            </div>

            <!-- 应用网格（各独立 App 入口槽位） -->
            <div class="app-grid">
                <div class="app-slot" id="appSlotChat" onclick="openPhoneApp('chat')">
                    <div class="app-icon-box" style="background: linear-gradient(135deg, #51cf66, #2b8a3e);">
                        <svg class="app-icon-svg" viewBox="0 0 24 24" fill="#ffffff">
                            <path d="M20 2H4c-1.1 0-2 .9-2 2v18l4-4h14c1.1 0 2-.9 2-2V4c0-1.1-.9-2-2-2z"/>
                        </svg>
                        <div class="app-unread-badge" id="chatUnreadBadge" style="display:none;">0</div>
                    </div>
                    <div class="app-title-label">聊天中心</div>
                </div>

                <div class="app-slot" id="appSlotMoments" onclick="openPhoneApp('moments')">
                    <div class="app-icon-box" style="background: linear-gradient(135deg, #ff8787, #e03131);">
                        <svg class="app-icon-svg" viewBox="0 0 24 24" fill="#ffffff">
                            <path d="M12 21.35l-1.45-1.32C5.4 15.36 2 12.28 2 8.5 2 5.42 4.42 3 7.5 3c1.74 0 3.41.81 4.5 2.09C13.09 3.81 14.76 3 16.5 3 19.58 3 22 5.42 22 8.5c0 3.78-3.4 6.86-8.55 11.54L12 21.35z"/>
                        </svg>
                    </div>
                    <div class="app-title-label">朋友圈</div>
                </div>

                <div class="app-slot" id="appSlotYoutube" onclick="openPhoneApp('youtube')">
                    <div class="app-icon-box" style="background: linear-gradient(135deg, #ff6b6b, #c92a2a);">
                        <svg class="app-icon-svg" viewBox="0 0 24 24" fill="#ffffff">
                            <path d="M21.58 7.19c-.23-.86-.91-1.54-1.77-1.77C18.25 5 12 5 12 5s-6.25 0-7.81.42c-.86.23-1.54.91-1.77 1.77C2 8.75 2 12 2 12s0 3.25.42 4.81c.23.86.91 1.54 1.77 1.77C5.75 19 12 19 12 19s6.25 0 7.81-.42c.86-.23 1.54-.91 1.77-1.77C22 15.25 22 12 22 12s0-3.25-.42-4.81zM10 15V9l5.2 3-5.2 3z"/>
                        </svg>
                    </div>
                    <div class="app-title-label">油管视频</div>
                </div>

                <div class="app-slot" id="appSlotAo3" onclick="openPhoneApp('ao3')">
                    <div class="app-icon-box" style="background: linear-gradient(135deg, #cc5de8, #862e9c);">
                        <svg class="app-icon-svg" viewBox="0 0 24 24" fill="#ffffff">
                            <path d="M18 2H6c-1.1 0-2 .9-2 2v16c0 1.1.9 2 2 2h12c1.1 0 2-.9 2-2V4c0-1.1-.9-2-2-2zM6 4h5v8l-2.5-1.5L6 12V4z"/>
                        </svg>
                    </div>
                    <div class="app-title-label">AO3同人</div>
                </div>

                <div class="app-slot" id="appSlotStream" onclick="openPhoneApp('streaming')">
                    <div class="app-icon-box" style="background: linear-gradient(135deg, #748ffc, #364fc7);">
                        <svg class="app-icon-svg" viewBox="0 0 24 24" fill="#ffffff">
                            <path d="M17 10.5V7c0-.55-.45-1-1-1H4c-.55 0-1 .45-1 1v10c0 .55.45 1 1 1h12c.55 0 1-.45 1-1v-3.5l4 4v-11l-4 4z"/>
                        </svg>
                    </div>
                    <div class="app-title-label">开播中心</div>
                </div>

                <div class="app-slot" id="appSlotStory" onclick="openPhoneApp('story')">
                    <div class="app-icon-box" style="background: linear-gradient(135deg, #20c997, #099268);">
                        <svg class="app-icon-svg" viewBox="0 0 24 24" fill="#ffffff">
                            <path d="M4 6h16v2H4zm0 5h16v2H4zm0 5h16v2H4z"/>
                        </svg>
                    </div>
                    <div class="app-title-label">主线频道</div>
                </div>

                <!-- 个性主题 APP -->
                <div class="app-slot" id="appSlotTheme" onclick="openPhoneApp('theme')">
                    <div class="app-icon-box" style="background: linear-gradient(135deg, #f06595, #c2255c);">
                        <svg class="app-icon-svg" viewBox="0 0 24 24" fill="#ffffff">
                            <path d="M12 3c-4.97 0-9 4.03-9 9 0 2.12.74 4.07 1.97 5.61L4.35 19.4c-.39.39-.39 1.02 0 1.41.39.39 1.02.39 1.41 0l1.9-1.9C9.23 19.57 10.57 20 12 20c4.97 0 9-4.03 9-9s-4.03-9-9-9zm0 15c-3.31 0-6-2.69-6-6s2.69-6 6-6 6 2.69 6 6-2.69 6-6 6z"/>
                        </svg>
                    </div>
                    <div class="app-title-label">个性主题</div>
                </div>

                <div class="app-slot" id="appSlotShop" onclick="openPhoneApp('shop')">
                    <div class="app-icon-box" style="background: linear-gradient(135deg, #38d9a9, #087f5b);">
                        <svg class="app-icon-svg" viewBox="0 0 24 24" fill="#ffffff">
                            <path d="M20 6h-4V4c0-1.11-.89-2-2-2h-4c-1.11 0-2 .89-2 2v2H4c-1.11 0-1.99.89-1.99 2L2 19c0 1.11.89 2 2 2h16c1.11 0 2-.89 2-2V8c0-1.11-.89-2-2-2zm-6 0h-4V4h4v2z"/>
                        </svg>
                    </div>
                    <div class="app-title-label">商务赞助</div>
                </div>
            </div>

            <!-- 底部 Dock 栏 -->
            <div>
                <div class="dock-container">
                    <div class="app-slot" onclick="openPhoneApp('contacts')">
                        <div class="app-icon-box" style="background: #2b8a3e; width: 50px; height: 50px;">
                            <svg class="app-icon-svg" style="width:25px;height:25px;" viewBox="0 0 24 24" fill="#ffffff">
                                <path d="M20.01 15.38c-1.23 0-2.42-.2-3.53-.56a.977.977 0 00-1.01.24l-1.57 1.97c-2.83-1.44-5.15-3.75-6.59-6.59l1.97-1.57c.28-.28.36-.67.25-1.02A11.36 11.36 0 018.57 4c0-.55-.45-1-1-1H4c-.55 0-1 .45-1 1 0 9.39 7.61 17 17 17 .55 0 1-.45 1-1v-3.5c0-.55-.45-1-1-1.12z"/>
                            </svg>
                        </div>
                    </div>
                    <div class="app-slot" onclick="openPhoneApp('settings')">
                        <div class="app-icon-box" style="background: #495057; width: 50px; height: 50px;">
                            <svg class="app-icon-svg" style="width:25px;height:25px;" viewBox="0 0 24 24" fill="#ffffff">
                                <path d="M19.14 12.94c.04-.3.06-.61.06-.94 0-.32-.02-.64-.07-.94l2.03-1.58a.49.49 0 00.12-.61l-1.92-3.32a.488.488 0 00-.59-.22l-2.39.96c-.5-.38-1.03-.7-1.62-.94l-.36-2.54a.484.484 0 00-.48-.41h-3.84c-.24 0-.43.17-.47.41l-.36 2.54c-.59.24-1.13.57-1.62.94l-2.39-.96c-.22-.08-.47 0-.59.22L2.74 8.87c-.12.21-.08.47.12.61l2.03 1.58c-.05.3-.09.63-.09.94s.02.64.07.94l-2.03 1.58a.49.49 0 00-.12.61l1.92 3.32c.12.22.37.29.59.22l2.39-.96c.5.38 1.03.7 1.62.94l.36 2.54c.05.24.24.41.48.41h3.84c.24 0 .44-.17.47-.41l.36-2.54c.59-.24 1.13-.56 1.62-.94l2.39.96c.22.08.47 0 .59-.22l1.92-3.32c.12-.22.07-.47-.12-.61l-2.01-1.58zM12 15.6c-1.98 0-3.6-1.62-3.6-3.6s1.62-3.6 3.6-3.6 3.6 1.62 3.6 3.6-1.62 3.6-3.6 3.6z"/>
                            </svg>
                        </div>
                    </div>
                    <div class="app-slot" onclick="openPhoneApp('backup')">
                        <div class="app-icon-box" style="background: #845ef7; width: 50px; height: 50px;">
                            <svg class="app-icon-svg" style="width:25px;height:25px;" viewBox="0 0 24 24" fill="#ffffff">
                                <path d="M19 3H5c-1.1 0-2 .9-2 2v14c0 1.1.9 2 2 2h14c1.1 0 2-.9 2-2V5c0-1.1-.9-2-2-2zm-2 10h-4v4h-2v-4H7v-2h4V7h2v4h4v2z"/>
                            </svg>
                        </div>
                    </div>
                </div>
                <div class="home-bar-pill"></div>
            </div>
        </div>

        <!-- 3. App 独立全屏窗口容器（各独立 App 渲染挂载根节点） -->
        <div class="app-modal-layer" id="appModal">
            <div class="app-modal-head">
                <button class="app-back-nav" onclick="closePhoneApp()">
                    <svg style="width:18px;height:18px;fill:currentColor;" viewBox="0 0 24 24">
                        <path d="M15.41 7.41L14 6l-6 6 6 6 1.41-1.41L10.83 12z"/>
                    </svg>
                    桌面
                </button>
                <div class="app-head-title" id="appModalTitle">应用窗口</div>
                <div style="width: 44px;"></div>
            </div>
            <div class="app-modal-body" id="appModalBody">
                <!-- 由各 App 动态挂载注入 -->
            </div>
            <div class="app-modal-foot">
                <div class="app-foot-home" onclick="closePhoneApp()"></div>
            </div>
        </div>

        <!-- 🎮 游戏核心功能底层宿主（保留原有节点以供各 App 平滑拆移） -->
        <div id="app" class="game-inner-viewport">
            <!-- ===== SETUP PAGE ===== -->
            <div id="setupPage" class="page active">
                <div class="setup-title">🎀 MC YouTube模拟器💕 6.0</div>
                <div class="setup-sub">成为我的世界主播，书写你的传奇</div>
                <div id="resumeBanner" style="display:none;background:#eaf5ea;border:2px solid var(--primary);border-radius:12px;padding:12px;margin:0 0 14px;text-align:center;"></div>
                <div class="setup-card">
                    <div class="api-key-section">
                        <div style="font-size:14px;font-weight:700;color:var(--text);margin-bottom:8px;display:flex;align-items:center;gap:6px;flex-wrap:wrap;">
                            <span>🌐 联网与AI模型设置</span>
                            <span style="background:var(--primary);color:#fff;padding:0 8px;border-radius:12px;font-size:11px;font-weight:700;">OpenAI 兼容接口</span>
                        </div>
                        <div id="apiSettingsContainer"></div>
                    </div>
                    <div class="form-group">
                        <label>📷 头像 <span class="required">*</span></label>
                        <div class="avatar-upload-wrap">
                            <div class="avatar-preview" id="avatarPreview">👤</div>
                            <button class="upload-btn" id="uploadAvatarBtn">选择图片</button>
                            <input type="file" id="avatarFileInput" accept="image/png,image/jpeg" class="file-input">
                        </div>
                    </div>
                    <div class="form-group">
                        <label>🎭 你的身份 <span class="required">*</span></label>
                        <div class="radio-group" id="identityGroup">
                            <input type="radio" name="identity" id="idNew" value="new" checked>
                            <label for="idNew">🆕 新主播</label>
                            <input type="radio" name="identity" id="idFans" value="fans">
                            <label for="idFans">⭐ 已有粉丝</label>
                            <input type="radio" name="identity" id="idVeteran" value="veteran">
                            <label for="idVeteran">🏆 老牌主播</label>
                        </div>
                    </div>
                    <div class="form-group">
                        <label>📅 年龄 <span class="required">*</span></label>
                        <input type="number" id="ageInput" placeholder="例如 18" min="1" max="150" value="18">
                    </div>
                    <div class="form-group">
                        <label>📺 YouTube 账号名 <span class="required">*</span></label>
                        <input type="text" id="ytNameInput" placeholder="例如：MC_CraftMaster" value="MC_CraftMaster">
                    </div>

                    <div class="form-group">
                        <label>📖 全局剧情叙事人称 (POV) <span class="required">*</span></label>
                        <select id="povSelect" style="width:100%;padding:8px 12px;border-radius:8px;border:2px solid rgba(30, 60, 30, 0.10);background:#f5faf5;color:var(--text);font-size:14px;outline:none;">
                            <option value="second" selected>第二人称【你】（经典沉浸代入式）</option>
                            <option value="first">第一人称【我】（身临其境主播自述视点）</option>
                            <option value="third">第三人称【她 / 频道名】（小说客观记录视点）</option>
                        </select>
                    </div>

                    <div class="form-group" style="background:#f9fbf9;border:1.5px solid #dceedc;border-radius:12px;padding:12px;margin:10px 0;">
                        <div style="font-weight:700;font-size:13.5px;color:#1e4620;margin-bottom:8px;display:flex;align-items:center;gap:6px;">
                            <span>🎭 形象三大维度细分设定（纯净空白，自由定制）</span>
                        </div>

                        <div class="form-group" style="margin-bottom:8px;">
                            <label style="font-size:12px;">1. 🖥️ 线上虚拟形象（Live2D / Vtuber皮套）</label>
                            <textarea id="avatarLive2dInput" placeholder="可选：描述直播与视频出镜时观众看到的虚拟形象风格（如皮套立绘、特征等）..." style="min-height:45px;"></textarea>
                        </div>

                        <div class="form-group" style="margin-bottom:8px;">
                            <label style="font-size:12px;">2. 🎮 游戏形象（Minecraft 像素皮肤）</label>
                            <textarea id="skinInput" placeholder="可选：描述你在Minecraft方块世界操纵角色的像素皮肤、披风、外观..." style="min-height:45px;"></textarea>
                        </div>

                        <div class="form-group" style="margin-bottom:0;">
                            <label style="font-size:12px;">3. 🏠 线下真实形象（现实皮下素颜）</label>
                            <textarea id="appearanceRealInput" placeholder="可选：描述现实生活中的真实容貌、体态声音、穿搭特征..." style="min-height:45px;"></textarea>
                        </div>
                    </div>

                    <div class="form-group">
                        <label>🎭 性格人设简介</label>
                        <textarea id="personaInput" placeholder="可选：描述你的性格人设、声音风格、语言习惯等..." style="min-height:40px;"></textarea>
                    </div>

                    <div class="form-group">
                        <label>🎯 创作赛道 <span class="required">*</span></label>
                        <select id="categorySelect">
                            <option value="追杀">⚔️ 追杀</option>
                            <option value="剧情" selected>📖 剧情</option>
                            <option value="生存">🌿 生存</option>
                            <option value="休闲">🎮 休闲</option>
                            <option value="建筑教程">🏗️ 建筑教程</option>
                            <option value="红石">🔴 红石</option>
                            <option value="整活">🤡 整活</option>
                            <option value="混合">🌈 混合</option>
                        </select>
                    </div>
                    <div class="form-group" style="margin-bottom:6px;">
                        <label style="font-size:12px;">🔧 技术属性 (0-100)</label>
                        <div class="skill-input-group"><label>🏗️</label><input type="range" id="skillBuilding" min="0" max="100" value="20"><input type="number" id="skillBuildingNum" min="0" max="100" value="20"></div>
                        <div class="skill-input-group"><label>🔧</label><input type="range" id="skillRedstone" min="0" max="100" value="20"><input type="number" id="skillRedstoneNum" min="0" max="100" value="20"></div>
                        <div class="skill-input-group"><label>⚔️</label><input type="range" id="skillPvp" min="0" max="100" value="20"><input type="number" id="skillPvpNum" min="0" max="100" value="20"></div>
                        <div class="skill-input-group"><label>🌲</label><input type="range" id="skillSurvival" min="0" max="100" value="20"><input type="number" id="skillSurvivalNum" min="0" max="100" value="20"></div>
                        <div class="skill-input-group"><label>🏹</label><input type="range" id="skillHunting" min="0" max="100" value="20"><input type="number" id="skillHuntingNum" min="0" max="100" value="20"></div>
                    </div>
                    <button class="btn-primary" id="startGameBtn">🚀 填入Key，开始游戏</button>
                    <button class="btn-secondary" id="setupLoadGameBtn" style="width:100%;margin-top:8px;">📂 读取已有存档</button>
                    <div style="display:flex;gap:8px;margin-top:8px;">
                        <button class="btn-secondary" id="setupBackupBtn" style="flex:1;">📤 图片备份</button>
                        <button class="btn-secondary" id="setupImportSaveBtn" style="flex:1;">📥 相册恢复</button>
                    </div>
                    <div style="margin-top:8px;font-size:11px;color:#999;text-align:center;">💡 所有剧情由 AI 实时生成，每回合 800+ 字</div>
                    <div style="margin-top:6px;font-size:11px;color:#e67e22;text-align:center;">⚠️ 更新App前请先点「📤 图片备份」，将存档图存入手机相册！</div>
                </div>
            </div>
            
            <!-- ===== GAME PAGE ===== -->
            <div id="gamePage" style="display:none;">
                <!-- 左侧竖排操作栏 -->
                <div class="action-bar-vertical" id="actionBar">
                    <button class="action-btn primary" data-action="stream"><span class="icon">📹</span><span class="label">直播</span></button>
                    <button class="action-btn gold" data-action="video"><span class="icon">🎬</span><span class="label">视频</span></button>
                    <button class="action-btn" data-action="chat"><span class="icon">💬</span><span class="label">聊天</span></button>
                    <button class="action-btn" data-action="fanart"><span class="icon">🎨</span><span class="label">同人</span></button>
                    <button class="action-btn" data-action="youtube"><span class="icon">▶️</span><span class="label">油管</span></button>
                    <button class="action-btn" data-action="sub"><span class="icon">🧘</span><span class="label">皮下</span></button>
                    <button class="action-btn" id="webSearchToggleBtn"><span class="icon">🌐</span><span class="label">联网</span></button>
                    <button class="action-btn" id="rerollBtn"><span class="icon">🔄</span><span class="label">重说</span></button>
                    <button class="action-btn" id="editContentBtn"><span class="icon">✏️</span><span class="label">编辑</span></button>
                    <button class="action-btn" id="memorySummaryBtn"><span class="icon">🧠</span><span class="label">记忆</span></button>
                    <button class="action-btn" data-action="next"><span class="icon">⏩</span><span class="label">下一天</span></button>
                </div>
                <!-- 右侧主区域 -->
                <div class="game-main">
                    <!-- 头部栏 -->
                    <div class="game-header">
                        <div class="game-header-top">
                            <div class="left">
                                <div class="avatar-circle" id="headerAvatar" style="cursor:pointer;position:relative;" title="点击修改头像与名字">
                                    <img id="headerAvatarImg" src="" alt="avatar">
                                </div>

    <!-- 🚀 安全的视图启动器 -->
    <script>
        document.addEventListener('DOMContentLoaded', function() {
            setTimeout(function() {
                try {
                    if (typeof OtomeSecurityGuard !== 'undefined' && OtomeSecurityGuard.isDeviceBanned()) {
                        if (typeof showDeviceBanLockScreen === 'function') {
                            showDeviceBanLockScreen();
                            return;
                        }
                    }

                    var autoInfo = (typeof getAutoSaveInfo === 'function') ? getAutoSaveInfo() : null;
                    var hasValidSave = !!(autoInfo && autoInfo.data && (autoInfo.data.player || autoInfo.data.npcs));

                    if (hasValidSave && typeof resumeAutoSave === 'function') {
                        resumeAutoSave();
                    } else {
                        var setup = document.getElementById('setupPage');
                        var game = document.getElementById('gamePage');
                        if (setup) { setup.classList.add('active'); setup.style.display = 'block'; }
                        if (game) { game.classList.remove('active'); game.style.display = 'none'; }
                    }
                } catch(e) {
                    console.warn('视图启动器遇到异常:', e);
                }
            }, 120);
        });
    </script>
