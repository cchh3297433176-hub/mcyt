<!-- index.html -->
<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>MC YouTube模拟器 6.0</title>
    <link rel="stylesheet" href="style.css">
    <!-- 🎨 移动端高兼容性紧凑布局与按钮错位修复补丁 -->
    <style>
        /* 根容器与视口防溢出 */
        html, body {
            margin: 0;
            padding: 0;
            height: 100%;
            overflow: hidden;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            background-color: #eaf2eb;
            box-sizing: border-box;
        }
        #appContainer {
            height: 100vh;
            display: flex;
            flex-direction: column;
            overflow: hidden;
            position: relative;
        }
        #gamePage {
            height: 100%;
            display: flex;
            flex-direction: column;
            overflow: hidden;
        }

        /* 顶部状态栏紧凑化重构 */
        .game-header {
            flex-shrink: 0;
            background: #ffffff;
            border-bottom: 1px solid #dcdfe6;
            padding: 8px 12px;
            display: flex;
            flex-direction: column;
            gap: 6px;
            box-shadow: 0 1px 4px rgba(0,0,0,0.05);
            z-index: 20;
        }
        .header-top-row {
            display: flex;
            justify-content: space-between;
            align-items: center;
        }
        .header-user-badge {
            display: flex;
            align-items: center;
            gap: 8px;
            cursor: pointer;
        }
        .header-avatar-circle {
            width: 38px;
            height: 38px;
            border-radius: 50%;
            background: #eef7ee;
            border: 2px solid #52c41a;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 20px;
        }
        .header-name-info {
            display: flex;
            flex-direction: column;
        }
        .header-name {
            font-weight: bold;
            font-size: 15px;
            color: #2c3e50;
            line-height: 1.2;
        }
        .header-time-info {
            font-size: 12px;
            color: #7f8c8d;
            margin-top: 2px;
            display: flex;
            gap: 6px;
        }
        .header-status-row {
            margin: 0;
            padding: 0;
        }
        .ap-bar-container {
            display: flex;
            align-items: center;
            gap: 4px;
            font-size: 13px;
            font-weight: 600;
            color: #e67e22;
        }
        .ap-dots {
            display: flex;
            gap: 3px;
            margin-left: 4px;
        }
        .ap-dots .dot {
            width: 7px;
            height: 7px;
            border-radius: 50%;
            background: #ddd;
        }
        .ap-dots .dot.active {
            background: #f39c12;
        }

        /* 顶部功能按钮行 */
        .header-actions-row {
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 6px;
            flex-wrap: nowrap;
        }
        .hdr-btn {
            flex: 1;
            padding: 5px 2px;
            font-size: 12px;
            border: 1px solid #d9d9d9;
            background: #fafafa;
            border-radius: 6px;
            cursor: pointer;
            white-space: nowrap;
            text-align: center;
            transition: all 0.2s;
            color: #333;
        }
        .hdr-btn:active {
            background: #e6f7ff;
            border-color: #91d5ff;
        }
        .hdr-pill.fans-pill {
            display: inline-flex;
            align-items: center;
            gap: 3px;
            padding: 4px 8px;
            background: #fff0f0;
            border: 1px solid #ffccc7;
            border-radius: 12px;
            font-size: 12px;
            color: #cf1322;
            font-weight: 600;
            flex-shrink: 0;
        }

        /* 核心左右两栏布局 */
        .game-layout {
            flex: 1;
            display: flex;
            flex-direction: row;
            overflow: hidden;
            position: relative;
            background: #eaf2eb;
        }

        /* 左侧侧边栏规范尺寸 */
        .action-bar-vertical {
            width: 64px;
            min-width: 64px;
            max-width: 64px;
            background: #f6faf6;
            border-right: 1px solid #d6e4d6;
            display: flex;
            flex-direction: column;
            align-items: center;
            padding: 8px 0 12px 0;
            gap: 6px;
            overflow-y: auto;
            overflow-x: hidden;
            -webkit-overflow-scrolling: touch;
        }
        .action-bar-vertical::-webkit-scrollbar {
            display: none;
        }

        /* 常规行动按钮 & 独立App按钮 */
        .action-btn {
            width: 52px;
            height: 48px;
            border-radius: 10px;
            border: 1px solid #cce2cc;
            background: #ffffff;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            padding: 0;
            gap: 2px;
            box-shadow: 0 1px 2px rgba(0,0,0,0.03);
            transition: transform 0.1s, background 0.15s;
        }
        .action-btn:active {
            transform: scale(0.95);
            background: #e8f5e9;
        }
        .action-btn .btn-icon {
            font-size: 18px;
            line-height: 1;
        }
        .action-btn .btn-txt {
            font-size: 11px;
            line-height: 1;
            color: #333333;
            font-weight: 500;
        }
        .action-btn.next-day {
            margin-top: auto;
            background: #fffbe6;
            border-color: #ffe58f;
        }
        .action-btn.next-day .btn-txt {
            color: #d46b08;
            font-weight: 600;
        }

        /* 🚨 重点修复：辅助工具按钮（tool-btn）紧凑规范 */
        .tool-btn {
            width: 52px;
            height: 44px;
            border-radius: 8px;
            border: 1px dashed #b7d6b7;
            background: #fbfdfb;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            padding: 0;
            gap: 2px;
            box-sizing: border-box;
            outline: none;
            transition: all 0.15s;
        }
        .tool-btn:active {
            background: #e8f4e8;
            border-style: solid;
        }
        .tool-btn span:first-child {
            font-size: 16px;
            line-height: 1;
        }
        .tool-btn .tool-txt {
            font-size: 10px;
            line-height: 1;
            color: #555;
            white-space: nowrap;
        }

        /* 右侧主视口 */
        .main-viewport {
            flex: 1;
            display: flex;
            flex-direction: column;
            overflow: hidden;
            background: #f8faf8;
            position: relative;
        }

        /* 顶部横排 Tab 栏 */
        .tab-bar {
            flex-shrink: 0;
            display: flex;
            overflow-x: auto;
            white-space: nowrap;
            background: #ffffff;
            border-bottom: 1px solid #dcdfe6;
            padding: 4px 6px;
            gap: 4px;
            -webkit-overflow-scrolling: touch;
        }
        .tab-bar::-webkit-scrollbar {
            display: none;
        }
        .tab-btn {
            padding: 6px 10px;
            font-size: 12px;
            font-weight: 500;
            color: #606266;
            background: transparent;
            border: none;
            border-radius: 6px;
            cursor: pointer;
            flex-shrink: 0;
            transition: all 0.15s;
        }
        .tab-btn.active {
            color: #2e7d32;
            background: #e8f5e9;
            font-weight: bold;
        }

        /* Tab 内容容器 */
        .tab-content-wrap {
            flex: 1;
            position: relative;
            overflow: hidden;
        }
        .tab-pane {
            width: 100%;
            height: 100%;
            overflow-y: auto;
            overflow-x: hidden;
            box-sizing: border-box;
            padding: 12px;
            -webkit-overflow-scrolling: touch;
        }
        .story-stream {
            display: flex;
            flex-direction: column;
            gap: 12px;
            padding-bottom: 24px;
        }
        .story-card-welcome {
            background: #ffffff;
            border-radius: 12px;
            padding: 16px;
            box-shadow: 0 2px 8px rgba(0,0,0,0.06);
            border-left: 5px solid #4caf50;
            line-height: 1.6;
            color: #333;
        }
    </style>
</head>
<body>
    <div id="appContainer">
        <!-- 🎮 游戏初始开局身份设定页 -->
        <div id="setupPage" style="display:none;">
            <div class="setup-card">
                <h2>🎮 设定你的 Minecraft YouTube 主播</h2>
                <div class="form-group">
                    <label>频道名称</label>
                    <input type="text" id="setupYtName" placeholder="例如：MC_CraftMaster">
                </div>
                <div class="form-group">
                    <label>主播皮上形象 / 人设风格</label>
                    <input type="text" id="setupPersona" placeholder="例如：技术流高冷少女 / 搞笑整活阳光少年">
                </div>
                <div class="form-group">
                    <label>创作主打赛道</label>
                    <select id="setupCategory">
                        <option value="技术生存 & 红石研究">🔧 技术生存 & 红石研究</option>
                        <option value="极致猎人极限追杀 (Manhunt)">⚔️ 极限猎人追杀 (Manhunt)</option>
                        <option value="唯美大场景史诗建筑">🏗️ 唯美史诗建筑</option>
                        <option value="整蛊挑战与沙雕联机">🎉 整蛊挑战与沙雕联机</option>
                        <option value="硬核极限生存 (Hardcore)">💀 硬核极限生存 (Hardcore)</option>
                    </select>
                </div>
                <button class="btn-primary" id="btnStartGame" style="width:100%;margin-top:14px;">🚀 开启主播生涯</button>
            </div>
        </div>

        <!-- 🖥️ 游戏主视口与操作界面 -->
        <div id="gamePage" style="display:none;">
            <!-- 顶部状态栏 -->
            <header class="game-header">
                <div class="header-top-row">
                    <div class="header-user-badge" id="headerAvatar" title="点击修改头像与频道名">
                        <div class="header-avatar-circle" id="headerAvatarBox">
                            <span id="headerAvatarEmoji">🧑</span>
                        </div>
                        <div class="header-name-info">
                            <div class="header-name" id="headerYtName">MC_CraftMaster</div>
                            <div class="header-time-info">
                                <span id="dayDisplay">第 1 天</span>
                                <span id="timeSlotDisplay">早晨 ☀️</span>
                            </div>
                        </div>
                    </div>
                    <!-- 右上角紧凑行动点 -->
                    <div class="ap-bar-container">
                        <span class="ap-icon">⚡</span>
                        <span id="apDisplay">6</span>
                        <div class="ap-dots" id="apDots">
                            <span class="dot active"></span>
                            <span class="dot active"></span>
                            <span class="dot active"></span>
                            <span class="dot active"></span>
                            <span class="dot active"></span>
                            <span class="dot active"></span>
                        </div>
                    </div>
                </div>

                <div class="header-actions-row">
                    <button class="hdr-btn model-btn" id="headerSettingsBtn" title="模型与API设置">⚙️ 模型</button>
                    <button class="hdr-btn save-btn" id="headerSaveBtn" title="手动存档">💾 存档</button>
                    <button class="hdr-btn load-btn" id="headerLoadBtn" title="读取存档">📂 读档</button>
                    <button class="hdr-btn quit-btn" id="headerQuitBtn" title="退出重置">🚪 退出</button>
                    <div class="hdr-pill fans-pill" title="累计点赞/好感">
                        <span>❤️</span>
                        <span id="headerLikesCount">0</span>
                    </div>
                </div>
            </header>

            <!-- 核心布局：左侧竖排操作栏 + 右侧主内容视口 -->
            <div class="game-layout">
                <!-- 左侧竖排操作栏 -->
                <aside class="action-bar-vertical" id="actionBar">
                    <!-- 常规行动 -->
                    <button class="action-btn live" onclick="performAction('stream')">
                        <span class="btn-icon">📹</span>
                        <span class="btn-txt">直播</span>
                    </button>
                    <button class="action-btn video" onclick="performAction('video')">
                        <span class="btn-icon">🎬</span>
                        <span class="btn-txt">视频</span>
                    </button>

                    <!-- 手机独立 App 矩阵（0消耗点、不推时段） -->
                    <button class="action-btn app chat" onclick="performAction('chat')">
                        <span class="btn-icon">💬</span>
                        <span class="btn-txt">聊天</span>
                    </button>
                    <button class="action-btn app ao3" onclick="performAction('fanart')">
                        <span class="btn-icon">🎨</span>
                        <span class="btn-txt">同人</span>
                    </button>
                    <button class="action-btn app yt" onclick="performAction('youtube')">
                        <span class="btn-icon">▶️</span>
                        <span class="btn-txt">油管</span>
                    </button>

                    <button class="action-btn sub" onclick="performAction('sub')">
                        <span class="btn-icon">🧘</span>
                        <span class="btn-txt">皮下</span>
                    </button>

                    <!-- 辅助工具按钮（小巧精致排版） -->
                    <button class="tool-btn" id="toggleSearchBtn" title="联网搜索">
                        <span>🌐</span>
                        <span class="tool-txt">联网</span>
                    </button>
                    <button class="tool-btn" id="rerollStoryBtn" title="重新生成上一条">
                        <span>🔄</span>
                        <span class="tool-txt">重说</span>
                    </button>
                    <button class="tool-btn" id="editContentBtn" title="编辑已发内容与总结">
                        <span>✏️</span>
                        <span class="tool-txt">编辑</span>
                    </button>
                    <button class="tool-btn" id="memorySummaryBtn" title="记忆管理与总结">
                        <span>🧠</span>
                        <span class="tool-txt">记忆</span>
                    </button>

                    <button class="action-btn next-day" onclick="performAction('next')">
                        <span class="btn-icon">⏩</span>
                        <span class="btn-txt">下一天</span>
                    </button>
                </aside>

                <!-- 右侧主视口 -->
                <main class="main-viewport">
                    <!-- 顶部横排页签 -->
                    <nav class="tab-bar">
                        <button class="tab-btn active" data-tab="story">📖 剧情</button>
                        <button class="tab-btn" data-tab="stream">🔴 直播</button>
                        <button class="tab-btn" data-tab="dashboard">📊 频道</button>
                        <button class="tab-btn" data-tab="shop">🛒 商店</button>
                        <button class="tab-btn" data-tab="data">📈 数据</button>
                        <button class="tab-btn" data-tab="memoir">📜 回忆录</button>
                        <button class="tab-btn" data-tab="achievements">🏆 成就</button>
                    </nav>

                    <!-- Tab 内容容器 -->
                    <div class="tab-content-wrap">
                        <div id="storyTab" class="tab-pane active">
                            <div id="storyArea" class="story-stream">
                                <!-- 首次启动默认欢迎与引导卡片 -->
                                <div class="story-card-welcome">
                                    <h3 style="margin:0 0 8px 0; color:#2e7d32;">✨ 欢迎来到 Minecraft YouTube 生涯！</h3>
                                    <p style="margin:0 0 8px 0; font-size:13px; color:#555;">
                                        你现在已经是一名拥有专属风格的 MCUP 主。请点击左侧功能开启你的今天：
                                    </p>
                                    <ul style="margin:0; padding-left:20px; font-size:13px; color:#666; line-height:1.6;">
                                        <li><b>🎬 视频 / 📹 直播</b>：创作内容，积累粉丝与收益（消耗行动点）。</li>
                                        <li><b>💬 聊天 / 🎨 同人 / ▶️ 油管</b>：随时随地与好友主播互动，查看社区反响。</li>
                                        <li><b>⚙️ 模型</b>：记得先在右上角配置好你的 API Key 与模型档案哦！</li>
                                    </ul>
                                </div>
                            </div>
                        </div>

                        <div id="streamTab" class="tab-pane" style="display:none;"></div>
                        <div id="dashboardTab" class="tab-pane" style="display:none;"></div>
                        <div id="shopTab" class="tab-pane" style="display:none;"></div>
                        <div id="dataTab" class="tab-pane" style="display:none;"></div>
                        <div id="memoirTab" class="tab-pane" style="display:none;"></div>
                        <div id="achievementsTab" class="tab-pane" style="display:none;"></div>

                        <!-- 手机独立 App 视口 -->
                        <div id="socialTab" class="tab-pane" style="display:none;"></div>
                        <div id="browserTab" class="tab-pane" style="display:none;"></div>
                        <div id="youtubeTab" class="tab-pane" style="display:none;"></div>
                    </div>
                </main>
            </div>
        </div>

        <!-- 🏆 成就解锁轻量 Toast -->
        <div id="achievementToast" class="achievement-unlock-toast"></div>

        <!-- 📢 双页版本公告轮播弹窗容器 -->
        <div id="noticeModal" class="modal-overlay" style="display:none;">
            <div class="modal-window notice-window">
                <button class="modal-close-btn" id="noticeCloseBtn">✕</button>
                <div class="notice-slider-track" id="noticeSliderTrack"></div>
            </div>
        </div>

        <!-- 👤 主播信息修改弹窗容器 -->
        <div id="editProfileModal" class="modal-overlay" style="display:none;"></div>

        <!-- 🪟 全局通用模态弹窗系统 -->
        <div id="modalOverlay" class="modal-overlay" style="display:none;">
            <div class="modal-window">
                <button class="modal-close-btn" onclick="closeModal()">✕</button>
                <div id="modalBody" class="modal-body"></div>
                <div id="modalContent" class="modal-content"></div>
            </div>
        </div>

        <!-- ⏳ AI 请求加载遮罩 -->
        <div id="loadingOverlay" class="loading-overlay" style="display:none;">
            <div class="loading-spinner"></div>
            <div class="loading-text" id="loadingText">AI 正在组织语言与生成中...</div>
        </div>

        <!-- 💬 全局浮动提示 -->
        <div id="toastContainer" class="toast-container"></div>
        <div id="toast" class="toast-item" style="display:none;"></div>
    </div>

    <!-- 🛡️ 安全防崩溃与基础选择器兜底 -->
    <script>
        window.$ = id => document.getElementById(id);
        window.addEventListener('error', function(e) {
            console.warn('捕获到非致命警告，已自动防御:', e.message);
        });
    </script>

    <!-- 按序引入核心模块脚本 -->
    <script src="js/01-state-config.js"></script>
    <script src="js/02-ai-network.js"></script>
    <script src="js/03-game-core-1.js"></script>
    <script src="js/04-game-core-2.js"></script>
    <script src="js/05-streaming.js"></script>
    <script src="js/06-video-story.js"></script>
    <script src="js/07-actions-social.js"></script>
    <script src="js/08-save-load.js"></script>
    <script src="js/09-events-init.js"></script>

    <!-- 🚀 启动视口流转与平滑呈现 -->
    <script>
        (function() {
            function syncInitialView() {
                var setup = document.getElementById('setupPage');
                var game = document.getElementById('gamePage');
                if (!setup || !game) return;

                var hasSave = false;
                try {
                    hasSave = !!localStorage.getItem('mcyt_autosave');
                } catch(e) {}

                var isPlaying = (typeof window.G !== 'undefined' && window.G && window.G.phase === 'playing');

                if (isPlaying || hasSave) {
                    setup.style.display = 'none';
                    game.style.display = 'flex';
                } else {
                    setup.style.display = 'block';
                    game.style.display = 'none';
                }
            }

            if (document.readyState === 'loading') {
                document.addEventListener('DOMContentLoaded', syncInitialView);
            } else {
                syncInitialView();
            }
        })();
    </script>
</body>
</html>
