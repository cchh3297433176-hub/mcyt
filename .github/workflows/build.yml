name: Build APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build-apk:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Create Android Project
        run: |
          mkdir -p proj/app/src/main/assets proj/app/src/main/res/values proj/app/src/main/res/xml proj/app/src/main/java/com/mcyt/simulator
          cp -r index.html style.css js proj/app/src/main/assets/ 2>/dev/null || cp -r * proj/app/src/main/assets/

          echo "include ':app'" > proj/settings.gradle

          cat << 'EOF' > proj/build.gradle
          buildscript {
              repositories { google(); mavenCentral() }
              dependencies { classpath 'com.android.tools.build:gradle:8.1.4' }
          }
          allprojects {
              repositories { google(); mavenCentral() }
          }
          EOF

          cat << 'EOF' > proj/app/build.gradle
          apply plugin: 'com.android.application'
          android {
              namespace 'com.mcyt.simulator'
              compileSdk 34
              defaultConfig {
                  applicationId "com.mcyt.simulator"
                  minSdk 21
                  targetSdk 34
                  versionCode 1494
                  versionName "1.494"
              }
              compileOptions {
                  sourceCompatibility JavaVersion.VERSION_1_8
                  targetCompatibility JavaVersion.VERSION_1_8
              }
              buildTypes {
                  release { minifyEnabled false }
              }
          }
          EOF

          cat << 'EOF' > proj/app/src/main/res/values/styles.xml
          <resources>
              <style name="Theme.FullScreen" parent="android:Theme.NoTitleBar.Fullscreen">
                  <item name="android:windowNoTitle">true</item>
                  <item name="android:windowFullscreen">true</item>
              </style>
          </resources>
          EOF

          cat << 'EOF' > proj/app/src/main/res/xml/network_security_config.xml
          <?xml version="1.0" encoding="utf-8"?>
          <network-security-config>
              <base-config cleartextTrafficPermitted="true" />
          </network-security-config>
          EOF

          cat << 'EOF' > proj/app/src/main/AndroidManifest.xml
          <?xml version="1.0" encoding="utf-8"?>
          <manifest xmlns:android="http://schemas.android.com/apk/res/android">
              <uses-permission android:name="android.permission.INTERNET" />
              <uses-permission android:name="android.permission.WRITE_EXTERNAL_STORAGE" android:maxSdkVersion="28" />
              <application
                  android:label="Mcyt模拟器"
                  android:theme="@style/Theme.FullScreen"
                  android:networkSecurityConfig="@xml/network_security_config"
                  android:usesCleartextTraffic="true">
                  <activity
                      android:name=".MainActivity"
                      android:exported="true"
                      android:configChanges="orientation|screenSize|keyboardHidden">
                      <intent-filter>
                          <action android:name="android.intent.action.MAIN" />
                          <category android:name="android.intent.category.LAUNCHER" />
                      </intent-filter>
                  </activity>
              </application>
          </manifest>
          EOF

          cat << 'EOF' > proj/app/src/main/java/com/mcyt/simulator/MainActivity.java
          package com.mcyt.simulator;

          import android.app.Activity;
          import android.app.DownloadManager;
          import android.content.Context;
          import android.net.Uri;
          import android.os.Bundle;
          import android.os.Environment;
          import android.util.Base64;
          import android.webkit.DownloadListener;
          import android.webkit.WebChromeClient;
          import android.webkit.WebSettings;
          import android.webkit.WebView;
          import android.webkit.WebViewClient;
          import android.widget.Toast;
          import java.io.File;
          import java.io.FileOutputStream;

          public class MainActivity extends Activity {
              private WebView webView;

              @Override
              protected void onCreate(Bundle savedInstanceState) {
                  super.onCreate(savedInstanceState);
                  webView = new WebView(this);
                  setContentView(webView);

                  WebSettings s = webView.getSettings();
                  s.setJavaScriptEnabled(true);
                  s.setDomStorageEnabled(true);
                  s.setDatabaseEnabled(true);
                  s.setAllowFileAccess(true);
                  s.setAllowContentAccess(true);
                  s.setMixedContentMode(WebSettings.MIXED_CONTENT_ALWAYS_ALLOW);

                  webView.setWebViewClient(new WebViewClient());
                  webView.setWebChromeClient(new WebChromeClient());

                  final Context ctx = this;
                  webView.setDownloadListener(new DownloadListener() {
                      @Override
                      public void onDownloadStart(String url, String userAgent, String contentDisposition, String mimetype, long contentLength) {
                          try {
                              if (url != null && url.startsWith("data:")) {
                                  String[] parts = url.split(",");
                                  byte[] b = Base64.decode(parts[1], Base64.DEFAULT);
                                  File dir = Environment.getExternalStoragePublicDirectory(Environment.DIRECTORY_DOWNLOADS);
                                  File f = new File(dir, "mcyt_backup_" + System.currentTimeMillis() + ".json");
                                  FileOutputStream os = new FileOutputStream(f);
                                  os.write(b);
                                  os.close();
                                  Toast.makeText(ctx, "✅ 存档已保存至系统 Download 文件夹", Toast.LENGTH_LONG).show();
                              } else if (url != null) {
                                  DownloadManager.Request req = new DownloadManager.Request(Uri.parse(url));
                                  req.setNotificationVisibility(DownloadManager.Request.VISIBILITY_VISIBLE_NOTIFY_COMPLETED);
                                  req.setDestinationInExternalPublicDir(Environment.DIRECTORY_DOWNLOADS, "mcyt_save.json");
                                  DownloadManager dm = (DownloadManager) getSystemService(DOWNLOAD_SERVICE);
                                  if (dm != null) dm.enqueue(req);
                                  Toast.makeText(ctx, "📥 正在下载...", Toast.LENGTH_SHORT).show();
                              }
                          } catch (Exception e) {
                              Toast.makeText(ctx, "下载异常: " + e.getMessage(), Toast.LENGTH_SHORT).show();
                          }
                      }
                  });

                  webView.loadUrl("file:///android_asset/index.html");
              }

              @Override
              public void onBackPressed() {
                  if (webView != null && webView.canGoBack()) {
                      webView.goBack();
                  } else {
                      super.onBackPressed();
                  }
              }
          }
          EOF

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: '8.4'

      - name: Build APK
        run: |
          cd proj
          gradle assembleDebug --stacktrace

      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: McytSimulator-v1.494
          path: proj/app/build/outputs/apk/debug/app-debug.apk