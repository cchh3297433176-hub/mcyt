name: 构建纯净版 MCYT 模拟器 APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build-apk:
    runs-on: ubuntu-latest

    steps:
      - name: 检出仓库代码
        uses: actions/checkout@v4

      - name: 配置 Java 17 环境
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: 配置 Android SDK
        uses: android-actions/setup-android@v3

      - name: 生成极简全屏 Android WebView 壳工程
        run: |
          mkdir -p android-project/app/src/main/assets
          mkdir -p android-project/app/src/main/res/values
          mkdir -p android-project/app/src/main/res/xml
          mkdir -p android-project/app/src/main/java/com/mcyt/simulator

          # 1. 拷贝仓库文件到 assets 离线目录
          cp -r index.html style.css js android-project/app/src/main/assets/ 2>/dev/null || cp -r * android-project/app/src/main/assets/

          # 2. 根目录 settings.gradle 与 build.gradle
          echo "include ':app'" > android-project/settings.gradle
          cat << 'EOF' > android-project/build.gradle
          buildscript {
              repositories { google(); mavenCentral() }
              dependencies { classpath 'com.android.tools.build:gradle:8.1.1' }
          }
          allprojects {
              repositories { google(); mavenCentral() }
          }
          EOF

          # 3. app/build.gradle 配置
          cat << 'EOF' > android-project/app/build.gradle
          apply plugin: 'com.android.application'
          android {
              namespace 'com.mcyt.simulator'
              compileSdk 34
              defaultConfig {
                  applicationId "com.mcyt.simulator"
                  minSdk 21
                  targetSdk 34
                  versionCode 1494
                  versionName "1.494"
              }
              buildTypes {
                  release {
                      minifyEnabled false
                  }
              }
          }
          EOF# 4. 样式与安全配置（彻底全屏沉浸、放行 http 接口）
cat << 'EOF' > android-project/app/src/main/res/values/styles.xml
<resources>
    <style name="Theme.FullScreen" parent="android:Theme.NoTitleBar.Fullscreen">
        <item name="android:windowNoTitle">true</item>
        <item name="android:windowFullscreen">true</item>
    </style>
</resources>
EOF

cat << 'EOF' > android-project/app/src/main/res/xml/network_security_config.xml
<?xml version="1.0" encoding="utf-8"?>
<network-security-config>
    <base-config cleartextTrafficPermitted="true" />
</network-security-config>
EOF

# 5. AndroidManifest.xml
cat << 'EOF' > android-project/app/src/main/AndroidManifest.xml
<?xml version="1.0" encoding="utf-8"?>
<manifest xmlns:android="http://schemas.android.com/apk/res/android">
    <uses-permission android:name="android.permission.INTERNET" />
    <uses-permission android:name="android.permission.WRITE_EXTERNAL_STORAGE" android:maxSdkVersion="28" />
    <application
        android:label="Mcyt模拟器"
        android:theme="@style/Theme.FullScreen"
        android:networkSecurityConfig="@xml/network_security_config"
        android:usesCleartextTraffic="true">
        <activity
            android:name=".MainActivity"
            android:exported="true"
            android:configChanges="orientation|screenSize|keyboardHidden">
            <intent-filter>
                <action android:name="android.intent.action.MAIN" />
                <category android:name="android.intent.category.LAUNCHER" />
            </intent-filter>
        </activity>
    </application>
</manifest>
EOF    # 6. MainActivity.java（彻底放行 DownloadListener 与 blob/data/http）
    cat << 'EOF' > android-project/app/src/main/java/com/mcyt/simulator/MainActivity.java
    package com.mcyt.simulator;

    import android.app.Activity;
    import android.app.DownloadManager;
    import android.net.Uri;
    import android.os.Bundle;
    import android.os.Environment;
    import android.util.Base64;
    import android.webkit.*;
    import android.widget.Toast;
    import java.io.File;
    import java.io.FileOutputStream;

    public class MainActivity extends Activity {
        private WebView webView;

        @Override
        protected void onCreate(Bundle savedInstanceState) {
            super.onCreate(savedInstanceState);
            webView = new WebView(this);
            setContentView(webView);

            WebSettings s = webView.getSettings();
            s.setJavaScriptEnabled(true);
            s.setDomStorageEnabled(true);
            s.setDatabaseEnabled(true);
            s.setAllowFileAccess(true);
            s.setAllowContentAccess(true);
            s.setMixedContentMode(WebSettings.MIXED_CONTENT_ALWAYS_ALLOW);

            webView.setWebViewClient(new WebViewClient());
            webView.setWebChromeClient(new WebChromeClient());

            webView.setDownloadListener((url, userAgent, contentDisposition, mimetype, contentLength) -> {
                try {
                    if (url.startsWith("data:")) {
                        String[] parts = url.split(",");
                        String base64Data = parts[1];
                        byte[] decodedBytes = Base64.decode(base64Data, Base64.DEFAULT);
                        File path = Environment.getExternalStoragePublicDirectory(Environment.DIRECTORY_DOWNLOADS);
                        File file = new File(path, "mcyt_backup_" + System.currentTimeMillis() + ".json");
                        FileOutputStream os = new FileOutputStream(file, false);
                        os.write(decodedBytes);
                        os.flush();
                        os.close();
                        Toast.makeText(MainActivity.this, "✅ 存档已下载至 Download 目录", Toast.LENGTH_LONG).show();
                    } else {
                        DownloadManager.Request request = new DownloadManager.Request(Uri.parse(url));
                        request.setNotificationVisibility(DownloadManager.Request.VISIBILITY_VISIBLE_NOTIFY_COMPLETED);
                        request.setDestinationInExternalPublicDir(Environment.DIRECTORY_DOWNLOADS, "mcyt_backup.json");
                        DownloadManager dm = (DownloadManager) getSystemService(DOWNLOAD_SERVICE);
                        dm.enqueue(request);
                        Toast.makeText(MainActivity.this, "📥 正在下载存档...", Toast.LENGTH_SHORT).show();
                    }
                } catch (Exception e) {
                    Toast.makeText(MainActivity.this, "下载失败: " + e.getMessage(), Toast.LENGTH_SHORT).show();
                }
            });

            webView.loadUrl("file:///android_asset/index.html");
        }

        @Override
        public void onBackPressed() {
            if (webView.canGoBack()) {
                webView.goBack();
            } else {
                super.onBackPressed();
            }
        }
    }
    EOF

- name: 编译构建 APK
  run: |
    cd android-project
    gradle wrapper
    ./gradlew assembleDebug

- name: 上传构建好的纯净 APK 供手机下载
  uses: actions/upload-artifact@v4
  with:
    name: McytSimulator-Pure-v1.494
    path: android-project/app/build/outputs/apk/debug/app-debug.apk
