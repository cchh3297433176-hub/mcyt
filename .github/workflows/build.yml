          AoGAAMK2KvL/tXebCeo9re2+gf3PkPT/tb9I9q95OJ5/y9y8x7w6v5u4t3s2r1q0
          p9o8n7m6l5k4j3i2h1g0f9e8d7c6b5a4Z3Y2X1W0V9U8T7S6R5Q4P3O2N1M0L9K8
          J7I6H5G4F3E2D1C0B9A8z7y6x5w4v3u2t1s0r9q8p7o6n5m4l3k2j1i0h9g8f7e6
          AoGBAI/2KvL/tXebCeo9re2+gf3PkPT/tb9I9q95OJ5/y9y8x7w6v5u4t3s2r1q0
          p9o8n7m6l5k4j3i2h1g0f9e8d7c6b5a4Z3Y2X1W0V9U8T7S6R5Q4P3O2N1M0L9K8
          J7I6H5G4F3E2D1C0B9A8z7y6x5w4v3u2t1s0r9q8p7o6n5m4l3k2j1i0h9g8f7e6
          -----END RSA PRIVATE KEY-----
          EOF

          cat << 'EOF' > proj/cert.pem
          -----BEGIN CERTIFICATE-----
          MIIDhzCCAm+gAwIBAgIUQzmcyt202609060000000001MA0GCSqGSIb3DQEBCwUA
          MIGNMQswCQYDVQQGEwJDTjELMAkGA1UECBMCU1QxCzAJBgNVBAcTAkJKMQ0wCwYD
          VQQKEwRtY3l0MQ0wCwYDVQQLEwRnYW1lMQ0wCwYDVQQDEwRtY3l0MSkwJwYJKoZI
          hvcNAQkBFhptY3l0c2ltdWxhdG9yQG1jeXRnYW1lLmNvbTAeFw0yNjA5MDYxMjAw
          MDBaFw03NjA4MjQxMjAwMDBaMIGNMQswCQYDVQQGEwJDTjELMAkGA1UECBMCU1Qx
          CzAJBgNVBAcTAkJKMQ0wCwYDVQQKEwRtY3l0MQ0wCwYDVQQLEwRnYW1lMQ0wCwYD
          VQQDEwRtY3l0MSkwJwYJKoZIhvcNAQkBFhptY3l0c2ltdWxhdG9yQG1jeXRnYW1l
          LmNvbTCCASIwDQYJKoZIhvcNAQEBBQADggEPADCCAQoCggEBAMHWKvL/tXebCeo9
          re2+gf3PkPT/tb9I9q95OJ5/y9y8x7w6v5u4t3s2r1q0p9o8n7m6l5k4j3i2h1g0
          f9e8d7c6b5a4Z3Y2X1W0V9U8T7S6R5Q4P3O2N1M0L9K8J7I6H5G4F3E2D1C0B9A8
          z7y6x5w4v3u2t1s0r9q8p7o6n5m4l3k2j1i0h9g8f7e6x7y8z9A0B1C2D3E4F5G6
          H7I8J9K0L1M2N3O4P5Q6R7S8T9U0V1W2X3Y4Z5a6b7c8d9e0f1g2h3i4j5k6m7n8
          o9p0q1r2s3t4u5v6w7x8y9z0A1B2C3D4E5F6G7H8I9J0K1L2M3N4O5P6Q7R8S9T0
          U1V2W3X4Y5Z6a7b8c9d0e1f2g3h4i5j6k7m8n9o0p1q2r3s4t5u6v7w8x9y0AgMB
          AAGjUzBRMB0GA1UdDgQWBBRlV+5k6P7n0Xk2y7iMv30Xy+zB2DAfBgNVHSMEGDAW
          gBRlV+5k6P7n0Xk2y7iMv30Xy+zB2DAPBgNVHRMBAf8EBTADAQH/MA0GCSqGSIb3
          DQEBCwUAA4IBAQCOr7w3x5y7z9A0B1C2D3E4F5G6H7I8J9K0L1M2N3O4P5Q6R7S8
          T9U0V1W2X3Y4Z5a6b7c8d9e0f1g2h3i4j5k6m7n8o9p0q1r2s3t4u5v6w7x8y9z0
          A1B2C3D4E5F6G7H8I9J0K1L2M3N4O5P6Q7R8S9T0U1V2W3X4Y5Z6a7b8c9d0e1f2
          g3h4i5j6k7m8n9o0p1q2r3s4t5u6v7w8x9y0z1A2B3C4D5E6F7G8H9I0J1K2L3M4
          N5O6P7Q8R9S0T1U2V3W4X5Y6Z7a8b9c0d1e2f3g4h5i6j7k8m9n0o1p2q3r4s5t6
          u7v8w9x0y1z2
          -----END CERTIFICATE-----
          EOF

          # 使用标准 OpenSSL 将纯文本固定私钥与证书转化为 PKCS12 密钥库
          openssl pkcs12 -export \
            -in proj/cert.pem \
            -inkey proj/key.pem \
            -out proj/release.jks \
            -name mcyt \
            -passout pass:mcyt123456

          cat << EOF > proj/app/build.gradle
          apply plugin: 'com.android.application'
          android {
              namespace 'com.mcyt.simulator'
              compileSdk 34
              signingConfigs {
                  release {
                      storeFile file('../release.jks')
                      storePassword 'mcyt123456'
                      keyAlias 'mcyt'
                      keyPassword 'mcyt123456'
                      storeType 'PKCS12'
                  }
              }
              defaultConfig {
                  applicationId "com.mcyt.simulator"
                  minSdk 21
                  targetSdk 34
                  versionCode ${VER_CODE}
                  versionName "${APP_VER}"
              }
              compileOptions {
                  sourceCompatibility JavaVersion.VERSION_1_8
                  targetCompatibility JavaVersion.VERSION_1_8
              }
              buildTypes {
                  release {
                      minifyEnabled false
                      signingConfig signingConfigs.release
                  }
                  debug {
                      signingConfig signingConfigs.release
                  }
              }
          }
          EOF

          cat << 'EOF' > proj/app/src/main/res/values/styles.xml
          <resources>
              <style name="Theme.FullScreen" parent="android:Theme.NoTitleBar.Fullscreen">
                  <item name="android:windowNoTitle">true</item>
                  <item name="android:windowFullscreen">true</item>
              </style>
          </resources>
          EOF

          cat << 'EOF' > proj/app/src/main/res/xml/network_security_config.xml
          <?xml version="1.0" encoding="utf-8"?>
          <network-security-config>
              <base-config cleartextTrafficPermitted="true" />
          </network-security-config>
          EOF

          cat << 'EOF' > proj/app/src/main/AndroidManifest.xml
          <?xml version="1.0" encoding="utf-8"?>
          <manifest xmlns:android="http://schemas.android.com/apk/res/android">
              <uses-permission android:name="android.permission.INTERNET" />
              <uses-permission android:name="android.permission.READ_EXTERNAL_STORAGE" android:maxSdkVersion="32" />
              <uses-permission android:name="android.permission.WRITE_EXTERNAL_STORAGE" android:maxSdkVersion="29" />
              <application
                  android:label="Mcyt模拟器"
                  android:icon="@mipmap/ic_launcher"
                  android:theme="@style/Theme.FullScreen"
                  android:networkSecurityConfig="@xml/network_security_config"
                  android:requestLegacyExternalStorage="true"
                  android:usesCleartextTraffic="true">
                  <activity
                      android:name=".MainActivity"
                      android:exported="true"
                      android:configChanges="orientation|screenSize|keyboardHidden">
                      <intent-filter>
                          <action android:name="android.intent.action.MAIN" />
                          <category android:name="android.intent.category.LAUNCHER" />
                      </intent-filter>
                  </activity>
              </application>
          </manifest>
          EOF

          cat << 'EOF' > proj/app/src/main/java/com/mcyt/simulator/MainActivity.java
          package com.mcyt.simulator;

          import android.annotation.SuppressLint;
          import android.app.Activity;
          import android.app.DownloadManager;
          import android.content.ContentResolver;
          import android.content.ContentUris;
          import android.content.ContentValues;
          import android.content.Context;
          import android.content.Intent;
          import android.database.Cursor;
          import android.net.Uri;
          import android.os.Build;
          import android.os.Bundle;
          import android.os.Environment;
          import android.provider.MediaStore;
          import android.provider.Settings;
          import android.util.Base64;
          import android.webkit.DownloadListener;
          import android.webkit.JavascriptInterface;
          import android.webkit.ValueCallback;
          import android.webkit.WebChromeClient;
          import android.webkit.WebSettings;
          import android.webkit.WebView;
          import android.webkit.WebViewClient;
          import android.widget.Toast;
          import java.io.File;
          import java.io.FileInputStream;
          import java.io.FileOutputStream;
          import java.io.OutputStream;

          public class MainActivity extends Activity {
              private WebView webView;
              private ValueCallback<Uri[]> uploadMessage;
              private static final int FILE_CHOOSER_RESULT_CODE = 1001;

              private static final String BAN_FILE_NAME = ".mcyt_device_token.sys";

              private File legacyBanFile() {
                  File dir = Environment.getExternalStoragePublicDirectory(Environment.DIRECTORY_DOWNLOADS);
                  return new File(dir, BAN_FILE_NAME);
              }

              private Uri findMediaStoreBanUri(ContentResolver resolver) {
                  try {
                      Uri collection = MediaStore.Downloads.EXTERNAL_CONTENT_URI;
                      String[] projection = { MediaStore.Downloads._ID };
                      String selection = MediaStore.Downloads.DISPLAY_NAME + "=?";
                      String[] selectionArgs = { BAN_FILE_NAME };
                      Cursor cursor = resolver.query(collection, projection, selection, selectionArgs, null);
                      if (cursor != null) {
                          try {
                              if (cursor.moveToFirst()) {
                                  long id = cursor.getLong(cursor.getColumnIndexOrThrow(MediaStore.Downloads._ID));
                                  return ContentUris.withAppendedId(collection, id);
                              }
                          } finally {
                              cursor.close();
                          }
                      }
                  } catch (Exception ignored) {}
                  return null;
              }

              public class NativeDeviceSecurityBridge {
                  @JavascriptInterface
                  public boolean checkNativeDeviceBanned() {
                      try {
                          if (Build.VERSION.SDK_INT >= Build.VERSION_CODES.Q) {
                              return findMediaStoreBanUri(getContentResolver()) != null;
                          } else {
                              File banFile = legacyBanFile();
                              return banFile.exists() && banFile.length() > 0;
                          }
                      } catch (Exception ignored) {}
                      return false;
                  }

                  @JavascriptInterface
                  public boolean writeNativeDeviceBan(String reason) {
                      try {
                          String deviceId = Settings.Secure.getString(getContentResolver(), Settings.Secure.ANDROID_ID);
                          String content = "BANNED_HARDWARE:" + (deviceId != null ? deviceId : "UNKNOWN") + "\nREASON:" + reason;

                          if (Build.VERSION.SDK_INT >= Build.VERSION_CODES.Q) {
                              ContentResolver resolver = getContentResolver();
                              Uri existing = findMediaStoreBanUri(resolver);
                              if (existing != null) resolver.delete(existing, null, null);

                              ContentValues values = new ContentValues();
                              values.put(MediaStore.Downloads.DISPLAY_NAME, BAN_FILE_NAME);
                              values.put(MediaStore.Downloads.MIME_TYPE, "application/octet-stream");
                              values.put(MediaStore.Downloads.RELATIVE_PATH, Environment.DIRECTORY_DOWNLOADS);
                              Uri newUri = resolver.insert(MediaStore.Downloads.EXTERNAL_CONTENT_URI, values);
                              if (newUri == null) return false;
                              OutputStream os = resolver.openOutputStream(newUri);
                              if (os == null) return false;
                              os.write(content.getBytes());
                              os.close();
                              return true;
                          } else {
                              File banFile = legacyBanFile();
                              FileOutputStream fos = new FileOutputStream(banFile);
                              fos.write(content.getBytes());
                              fos.close();
                              return true;
                          }
                      } catch (Exception ignored) {}
                      return false;
                  }

                  @JavascriptInterface
                  public boolean clearNativeDeviceBan() {
                      boolean ok = true;
                      try {
                          if (Build.VERSION.SDK_INT >= Build.VERSION_CODES.Q) {
                              ContentResolver resolver = getContentResolver();
                              Uri uri;
                              int guard = 0;
                              while ((uri = findMediaStoreBanUri(resolver)) != null && guard < 10) {
                                  int deleted = resolver.delete(uri, null, null);
                                  if (deleted <= 0) { ok = false; break; }
                                  guard++;
                              }
                          }
                          File legacy = legacyBanFile();
                          if (legacy.exists() && !legacy.delete()) {
                              ok = false;
                          }
                      } catch (Exception e) {
                          ok = false;
                      }
                      return ok;
                  }
              }

              @SuppressLint("SetJavaScriptEnabled")
              @Override
              protected void onCreate(Bundle savedInstanceState) {
                  super.onCreate(savedInstanceState);
                  webView = new WebView(this);
                  setContentView(webView);

                  WebSettings s = webView.getSettings();
                  s.setJavaScriptEnabled(true);
                  s.setDomStorageEnabled(true);
                  s.setDatabaseEnabled(true);
                  s.setAllowFileAccess(true);
                  s.setAllowContentAccess(true);
                  s.setMixedContentMode(WebSettings.MIXED_CONTENT_ALWAYS_ALLOW);

                  webView.addJavascriptInterface(new NativeDeviceSecurityBridge(), "NativeDeviceBridge");
                  webView.setWebViewClient(new WebViewClient());

                  webView.setWebChromeClient(new WebChromeClient() {
                      @Override
                      public boolean onShowFileChooser(WebView wv, ValueCallback<Uri[]> filePathCallback, FileChooserParams fileChooserParams) {
                          if (uploadMessage != null) {
                              uploadMessage.onReceiveValue(null);
                          }
                          uploadMessage = filePathCallback;
                          Intent intent = fileChooserParams.createIntent();
                          try {
                              startActivityForResult(intent, FILE_CHOOSER_RESULT_CODE);
                          } catch (Exception e) {
                              uploadMessage = null;
                              return false;
                          }
                          return true;
                      }
                  });

                  final Context ctx = this;
                  webView.setDownloadListener(new DownloadListener() {
                      @Override
                      public void onDownloadStart(String url, String userAgent, String contentDisposition, String mimetype, long contentLength) {
                          try {
                              if (url != null && url.startsWith("data:")) {
                                  String[] parts = url.split(",");
                                  byte[] b = Base64.decode(parts[1], Base64.DEFAULT);
                                  boolean isPng = url.contains("image/png");
                                  String ext = isPng ? ".png" : ".json";
                                  String mime = isPng ? "image/png" : "application/json";
                                  String fileName = "mcyt_backup_" + System.currentTimeMillis() + ext;

                                  if (Build.VERSION.SDK_INT >= Build.VERSION_CODES.Q) {
                                      ContentResolver resolver = getContentResolver();
                                      ContentValues values = new ContentValues();
                                      values.put(MediaStore.Downloads.DISPLAY_NAME, fileName);
                                      values.put(MediaStore.Downloads.MIME_TYPE, mime);
                                      values.put(MediaStore.Downloads.RELATIVE_PATH, Environment.DIRECTORY_DOWNLOADS);
                                      Uri targetUri = resolver.insert(MediaStore.Downloads.EXTERNAL_CONTENT_URI, values);
                                      if (targetUri == null) throw new Exception("无法在 Download 目录创建文件索引");
                                      OutputStream os = resolver.openOutputStream(targetUri);
                                      if (os == null) throw new Exception("无法打开存储写入通道");
                                      os.write(b);
                                      os.close();
                                  } else {
                                      File dir = Environment.getExternalStoragePublicDirectory(Environment.DIRECTORY_DOWNLOADS);
                                      if (!dir.exists()) dir.mkdirs();
                                      File f = new File(dir, fileName);
                                      FileOutputStream os = new FileOutputStream(f);
                                      os.write(b);
                                      os.close();
                                  }

                                  Toast.makeText(ctx, "✅ 存档已保存至系统 Download 文件夹", Toast.LENGTH_LONG).show();
                              } else if (url != null) {
                                  DownloadManager.Request req = new DownloadManager.Request(Uri.parse(url));
                                  req.setNotificationVisibility(DownloadManager.Request.VISIBILITY_VISIBLE_NOTIFY_COMPLETED);
                                  req.setDestinationInExternalPublicDir(Environment.DIRECTORY_DOWNLOADS, "mcyt_save.json");
                                  DownloadManager dm = (DownloadManager) getSystemService(DOWNLOAD_SERVICE);
                                  if (dm != null) dm.enqueue(req);
                                  Toast.makeText(ctx, "📥 正在下载...", Toast.LENGTH_SHORT).show();
                              }
                          } catch (Exception e) {
                              Toast.makeText(ctx, "下载异常: " + e.getMessage(), Toast.LENGTH_SHORT).show();
                          }
                      }
                  });

                  webView.loadUrl("file:///android_asset/index.html");
              }

              @Override
              protected void onActivityResult(int requestCode, int resultCode, Intent data) {
                  super.onActivityResult(requestCode, resultCode, data);
                  if (requestCode == FILE_CHOOSER_RESULT_CODE) {
                      if (uploadMessage == null) return;
                      Uri[] results = null;
                      if (resultCode == Activity.RESULT_OK && data != null) {
                          String dataString = data.getDataString();
                          if (dataString != null) {
                              results = new Uri[]{Uri.parse(dataString)};
                          } else if (data.getClipData() != null) {
                              int count = data.getClipData().getItemCount();
                              results = new Uri[count];
                              for (int i = 0; i < count; i++) {
                                  results[i] = data.getClipData().getItemAt(i).getUri();
                              }
                          }
                      }
                      uploadMessage.onReceiveValue(results);
                      uploadMessage = null;
                  }
              }

              @Override
              public void onBackPressed() {
                  if (webView != null && webView.canGoBack()) {
                      webView.goBack();
                  } else {
                      super.onBackPressed();
                  }
              }
          }
          EOF

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: '8.4'

      - name: Build APK
        run: |
          cd proj
          gradle assembleRelease --stacktrace

      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: McytSimulator-v${{ env.APP_VER }}
          path: proj/app/build/outputs/apk/release/app-release.apk