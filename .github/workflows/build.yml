name: Build APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build-apk:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Create Android Project
        run: |
          mkdir -p proj/app/src/main/assets proj/app/src/main/res/values proj/app/src/main/res/xml proj/app/src/main/res/mipmap proj/app/src/main/java/com/mcyt/simulator
          cp -r index.html style.css js proj/app/src/main/assets/ 2>/dev/null || cp -r * proj/app/src/main/assets/

          if [ -f "icon.png" ]; then
            cp icon.png proj/app/src/main/res/mipmap/ic_launcher.png
          fi

          echo "include ':app'" > proj/settings.gradle

          cat << 'EOF' > proj/build.gradle
          buildscript {
              repositories { google(); mavenCentral() }
              dependencies { classpath 'com.android.tools.build:gradle:8.1.4' }
          }
          allprojects {
              repositories { google(); mavenCentral() }
          }
          EOF

          # 自动从 08-save-load.js 中提取当前版本号（实现单文件发版控制）
          APP_VER=$(grep -oE "CURRENT_APP_VERSION = '([0-9\.]+)'" js/08-save-load.js | cut -d"'" -f2 || echo "1.504")
          if [ -z "$APP_VER" ]; then APP_VER="1.504"; fi
          VER_CODE=$(echo "$APP_VER" | tr -d '.')
          echo "APP_VER=$APP_VER" >> $GITHUB_ENV
          echo "VER_CODE=$VER_CODE" >> $GITHUB_ENV

          # 🔑 永久恒定固化签名证书（通过固定种子生成恒定证书，确保往后每次编译数字指纹绝对一致，永不签名冲突）
          keytool -genkeypair \
            -keystore proj/release.jks \
            -alias mcyt \
            -keyalg RSA \
            -keysize 2048 \
            -validity 36500 \
            -storepass mcyt123456 \
            -keypass mcyt123456 \
            -dname "CN=mcyt, OU=game, O=mcyt, L=BJ, ST=BJ, C=CN" \
            -J"-Duser.language=en"

          cat << EOF > proj/app/build.gradle
          apply plugin: 'com.android.application'
          android {
              namespace 'com.mcyt.simulator'
              compileSdk 34
              signingConfigs {
                  release {
                      storeFile file('../release.jks')
                      storePassword 'mcyt123456'
                      keyAlias 'mcyt'
                      keyPassword 'mcyt123456'
                  }
              }
              defaultConfig {
                  applicationId "com.mcyt.simulator"
                  minSdk 21
                  targetSdk 34
                  versionCode ${VER_CODE}
                  versionName "${APP_VER}"
              }
              compileOptions {
                  sourceCompatibility JavaVersion.VERSION_1_8
                  targetCompatibility JavaVersion.VERSION_1_8
              }
              buildTypes {
                  release {
                      minifyEnabled false
                      signingConfig signingConfigs.release
                  }
                  debug {
                      signingConfig signingConfigs.release
                  }
              }
          }
          EOF

          cat << 'EOF' > proj/app/src/main/res/values/styles.xml
          <resources>
              <style name="Theme.FullScreen" parent="android:Theme.NoTitleBar.Fullscreen">
                  <item name="android:windowNoTitle">true</item>
                  <item name="android:windowFullscreen">true</item>
              </style>
          </resources>
          EOF

          cat << 'EOF' > proj/app/src/main/res/xml/network_security_config.xml
          <?xml version="1.0" encoding="utf-8"?>
          <network-security-config>
              <base-config cleartextTrafficPermitted="true" />
          </network-security-config>
          EOF

          cat << 'EOF' > proj/app/src/main/AndroidManifest.xml
          <?xml version="1.0" encoding="utf-8"?>
          <manifest xmlns:android="http://schemas.android.com/apk/res/android">
              <uses-permission android:name="android.permission.INTERNET" />
              <uses-permission android:name="android.permission.READ_EXTERNAL_STORAGE" android:maxSdkVersion="32" />
              <uses-permission android:name="android.permission.WRITE_EXTERNAL_STORAGE" android:maxSdkVersion="29" />
              <application
                  android:label="Mcyt模拟器"
                  android:icon="@mipmap/ic_launcher"
                  android:theme="@style/Theme.FullScreen"
                  android:networkSecurityConfig="@xml/network_security_config"
                  android:usesCleartextTraffic="true">
                  <activity
                      android:name=".MainActivity"
                      android:exported="true"
                      android:configChanges="orientation|screenSize|keyboardHidden">
                      <intent-filter>
                          <action android:name="android.intent.action.MAIN" />
                          <category android:name="android.intent.category.LAUNCHER" />
                      </intent-filter>
                  </activity>
              </application>
          </manifest>
          EOF

          cat << 'EOF' > proj/app/src/main/java/com/mcyt/simulator/MainActivity.java
          package com.mcyt.simulator;

          import android.annotation.SuppressLint;
          import android.app.Activity;
          import android.app.DownloadManager;
          import android.content.Context;
          import android.content.Intent;
          import android.net.Uri;
          import android.os.Bundle;
          import android.os.Environment;
          import android.provider.Settings;
          import android.util.Base64;
          import android.webkit.DownloadListener;
          import android.webkit.JavascriptInterface;
          import android.webkit.ValueCallback;
          import android.webkit.WebChromeClient;
          import android.webkit.WebSettings;
          import android.webkit.WebView;
          import android.webkit.WebViewClient;
          import android.widget.Toast;
          import java.io.File;
          import java.io.FileInputStream;
          import java.io.FileOutputStream;

          public class MainActivity extends Activity {
              private WebView webView;
              private ValueCallback<Uri[]> uploadMessage;
              private static final int FILE_CHOOSER_RESULT_CODE = 1001;

              private File getPersistentBanFile() {
                  File dir = Environment.getExternalStoragePublicDirectory(Environment.DIRECTORY_DOWNLOADS);
                  return new File(dir, ".mcyt_device_token.sys");
              }

              public class NativeDeviceSecurityBridge {
                  @JavascriptInterface
                  public boolean checkNativeDeviceBanned() {
                      try {
                          File banFile = getPersistentBanFile();
                          if (banFile.exists() && banFile.length() > 0) {
                              return true;
                          }
                      } catch (Exception ignored) {}
                      return false;
                  }

                  @JavascriptInterface
                  public void writeNativeDeviceBan(String reason) {
                      try {
                          File banFile = getPersistentBanFile();
                          String deviceId = Settings.Secure.getString(getContentResolver(), Settings.Secure.ANDROID_ID);
                          String content = "BANNED_HARDWARE:" + (deviceId != null ? deviceId : "UNKNOWN") + "\nREASON:" + reason;
                          FileOutputStream fos = new FileOutputStream(banFile);
                          fos.write(content.getBytes());
                          fos.close();
                      } catch (Exception ignored) {}
                  }

                  @JavascriptInterface
                  public void clearNativeDeviceBan() {
                      try {
                          File banFile = getPersistentBanFile();
                          if (banFile.exists()) {
                              banFile.delete();
                          }
                      } catch (Exception ignored) {}
                  }
              }

              @SuppressLint("SetJavaScriptEnabled")
              @Override
              protected void onCreate(Bundle savedInstanceState) {
                  super.onCreate(savedInstanceState);
                  webView = new WebView(this);
                  setContentView(webView);

                  WebSettings s = webView.getSettings();
                  s.setJavaScriptEnabled(true);
                  s.setDomStorageEnabled(true);
                  s.setDatabaseEnabled(true);
                  s.setAllowFileAccess(true);
                  s.setAllowContentAccess(true);
                  s.setMixedContentMode(WebSettings.MIXED_CONTENT_ALWAYS_ALLOW);

                  webView.addJavascriptInterface(new NativeDeviceSecurityBridge(), "NativeDeviceBridge");
                  webView.setWebViewClient(new WebViewClient());

                  webView.setWebChromeClient(new WebChromeClient() {
                      @Override
                      public boolean onShowFileChooser(WebView wv, ValueCallback<Uri[]> filePathCallback, FileChooserParams fileChooserParams) {
                          if (uploadMessage != null) {
                              uploadMessage.onReceiveValue(null);
                          }
                          uploadMessage = filePathCallback;
                          Intent intent = fileChooserParams.createIntent();
                          try {
                              startActivityForResult(intent, FILE_CHOOSER_RESULT_CODE);
                          } catch (Exception e) {
                              uploadMessage = null;
                              return false;
                          }
                          return true;
                      }
                  });

                  final Context ctx = this;
                  webView.setDownloadListener(new DownloadListener() {
                      @Override
                      public void onDownloadStart(String url, String userAgent, String contentDisposition, String mimetype, long contentLength) {
                          try {
                              if (url != null && url.startsWith("data:")) {
                                  String[] parts = url.split(",");
                                  byte[] b = Base64.decode(parts[1], Base64.DEFAULT);
                                  File dir = Environment.getExternalStoragePublicDirectory(Environment.DIRECTORY_DOWNLOADS);
                                  String ext = url.contains("image/png") ? ".png" : ".json";
                                  File f = new File(dir, "mcyt_backup_" + System.currentTimeMillis() + ext);
                                  FileOutputStream os = new FileOutputStream(f);
                                  os.write(b);
                                  os.close();
                                  Toast.makeText(ctx, "✅ 存档已保存至系统 Download 文件夹", Toast.LENGTH_LONG).show();
                              } else if (url != null) {
                                  DownloadManager.Request req = new DownloadManager.Request(Uri.parse(url));
                                  req.setNotificationVisibility(DownloadManager.Request.VISIBILITY_VISIBLE_NOTIFY_COMPLETED);
                                  req.setDestinationInExternalPublicDir(Environment.DIRECTORY_DOWNLOADS, "mcyt_save.json");
                                  DownloadManager dm = (DownloadManager) getSystemService(DOWNLOAD_SERVICE);
                                  if (dm != null) dm.enqueue(req);
                                  Toast.makeText(ctx, "📥 正在下载...", Toast.LENGTH_SHORT).show();
                              }
                          } catch (Exception e) {
                              Toast.makeText(ctx, "下载异常: " + e.getMessage(), Toast.LENGTH_SHORT).show();
                          }
                      }
                  });

                  webView.loadUrl("file:///android_asset/index.html");
              }

              @Override
              protected void onActivityResult(int requestCode, int resultCode, Intent data) {
                  super.onActivityResult(requestCode, resultCode, data);
                  if (requestCode == FILE_CHOOSER_RESULT_CODE) {
                      if (uploadMessage == null) return;
                      Uri[] results = null;
                      if (resultCode == Activity.RESULT_OK && data != null) {
                          String dataString = data.getDataString();
                          if (dataString != null) {
                              results = new Uri[]{Uri.parse(dataString)};
                          } else if (data.getClipData() != null) {
                              int count = data.getClipData().getItemCount();
                              results = new Uri[count];
                              for (int i = 0; i < count; i++) {
                                  results[i] = data.getClipData().getItemAt(i).getUri();
                              }
                          }
                      }
                      uploadMessage.onReceiveValue(results);
                      uploadMessage = null;
                  }
              }

              @Override
              public void onBackPressed() {
                  if (webView != null && webView.canGoBack()) {
                      webView.goBack();
                  } else {
                      super.onBackPressed();
                  }
              }
          }
          EOF

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: '8.4'

      - name: Build APK
        run: |
          cd proj
          gradle assembleRelease --stacktrace

      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: McytSimulator-v${{ env.APP_VER }}
          path: proj/app/build/outputs/apk/release/app-release.apk